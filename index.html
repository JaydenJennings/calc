
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>

    <script>
       
        let num1 = 10;
        let num2 = 3;

        
        alert(
            "Sum: " + (num1 + num2) +
            "\nDifference: " + (num1 - num2) +
            "\nProduct: " + (num1 * num2) +
            "\nQuotient: " + (num1 / num2) +
            "\nRemainder: " + (num1 % num2) +
            "\nRounded Quotient: " + Math.round(num1 / num2) +
            "\nCurrent Year: " + new Date().getFullYear()
        );
    </script>

</body>
</html>
